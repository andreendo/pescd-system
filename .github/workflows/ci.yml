name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Testes de unidade e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Sobe o PostgreSQL e o SeaweedFS
        run: docker compose up -d

      - name: Espera o PostgreSQL e o SeaweedFS
        run: |
          for i in $(seq 1 60); do
            if docker exec pescd-postgres pg_isready -U postgres && curl -sf http://localhost:9333/cluster/status > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build, testes e relatório de cobertura
        run: ./mvnw -B verify

      - name: Publica o relatório do JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
